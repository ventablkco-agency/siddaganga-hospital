name: Hero Fluid Build
on:
  push:
    branches:
      - hero-fluid
  pull_request:
    branches:
      - hero-fluid
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
