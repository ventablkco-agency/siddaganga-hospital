name: Visual QA

on:
  push:
    branches:
      - hero-fluid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    name: Render responsive screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Test for CI
        run: npm install --no-save @playwright/test@latest

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Run responsive visual QA
        run: npx playwright test tests/visual-qa.spec.mjs

      - name: Upload screenshots and Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: siddaganga-visual-qa-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
