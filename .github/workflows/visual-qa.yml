name: Visual QA

on:
  push:
    branches:
      - hero-fluid
  pull_request:
    branches:
      - hero-fluid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    name: Responsive Visual QA
    uses: ./.github/workflows/reusable-visual-qa.yml
    with:
      node-version: '22'
      build-command: 'npm run build'
      preview-command: 'npm run preview -- --host 127.0.0.1 --port 4321'
      test-command: 'npx playwright test'
      playwright-version: '1.63.0'
